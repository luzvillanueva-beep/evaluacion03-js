<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaféTec - Gestor de Pedidos (Pregunta 1)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { margin-bottom: 15px; }
    input, select, button { padding: 8px; margin-right: 5px; }
    #mensaje { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h1>CaféTec - Registro de Pedidos</h1>

  <!-- Estructura obligatoria del examen -->
  <form id="form-pedido">
    <input id="producto" placeholder="Producto" autocomplete="off">
    <input id="precio" type="number" step="0.10" placeholder="Precio S/">
    <input id="cantidad" type="number" min="0" placeholder="Cantidad">
    <button type="submit">Agregar</button>
  </form>

  <p id="mensaje"></p>

  <select id="filtro">
    <option value="todos">Todos</option>
    <option value="pendiente">Pendientes</option>
    <option value="entregado">Entregados</option>
  </select>

  <ul id="lista-pedidos"></ul>

  <p id="total"><strong>Total a cobrar: S/ 0.00</strong></p>

  <!-- Enlace al archivo JavaScript -->
  <script src="app.js"></script>
</body>
</html>
